<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Login - Smart Car Costs</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/logo.css}">
  <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

<div class="login-logo-wrapper">
  <a th:href="@{/}" class="logo">SmartCarCosts</a>
</div>

<div class="login-card">
  <div class="login-header">
    <h2 class="login-title">Welcome!</h2>
    <p class="login-subtitle">Please enter your login details</p>
  </div>

  <form th:action="@{/login}" method="POST">
    <div class="login-form-group">
      <label class="login-label">Email</label>
      <input type="email" name="email" required class="login-input">
      <div th:if="${param.error}" class="login-error">
        Invalid email or password. Please try again.
      </div>
    </div>

    <div class="login-form-group">
      <div class="login-label-row">
        <label class="login-label">Password</label>
        <a th:href="@{/forget-password}" class="login-forgot-link">Forget password?</a>
      </div>
      <input type="password" name="password" required class="login-input-password">
    </div>

    <button type="submit" class="login-submit-btn">Sign In</button>
  </form>

  <div class="login-footer">
    <p>Don't have an account? <a th:href="@{/register}" class="login-link">Sign Up</a></p>
    <p>Want to create a <a th:href="@{/service-register}" class="login-link">service account</a>?</p>
  </div>
</div>

</body>
</html>
