<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Service Main Interface</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/logo.css}">
    <link rel="stylesheet" th:href="@{/css/main-interface.css}">
    <link rel="stylesheet" th:href="@{/css/service-main-interface.css}">
</head>
<body>

<div class="service-page">

    <div class="service-main-wrapper">

        <header class="service-header">

            <a th:href="@{/service-main-interface}" class="logo">
                SmartCarCosts
            </a>

            <div class="service-header-center"></div>

            <div class="profile-box service-profile-box"
                 onclick="openModal()">

                <span class="user-name"
                      th:text="${userName}">
                </span>

                <div class="avatar"></div>
            </div>

        </header>

        <main class="service-content">

            <div class="service-actions-row">

                <select id="brandFilter"
                        class="service-filter"
                        onchange="filterServiceCars()">

                    <option value="">All brands</option>

                    <option th:each="car : ${cars}"
                            th:value="${car.brandName}"
                            th:text="${car.brandName}">
                    </option>

                </select>

                <input id="plateSearch"
                       type="text"
                       class="service-search"
                       placeholder="Enter licence plate..."
                       oninput="filterServiceCars()">

                <div></div>

                <button class="service-new-car-btn" onclick="document.getElementById('addServiceCarModal').style.display='flex'">
                    + New car
                </button>>

            </div>

            <div id="addServiceCarModal" class="modal">
                <div class="modal-content dark-modal add-car-modal">
                    <h2>Add new car</h2>
                    <p class="text-dim">Fill in your car's parameters</p>

                    <form th:action="@{/service/cars/add}" method="POST" class="dark-form">
                        <div class="form-section-title">Basic parameters</div>

                        <div class="two-columns">
                            <div class="column">
                                <div class="form-group">
                                    <label>Brand <span class="required-star">*</span></label>
                                    <select id="serviceBrandSelect" name="brandId" required onchange="filterServiceModels()">
                                        <option value="">Select brand</option>
                                        <option th:each="brand : ${brands}" th:value="${brand.id}" th:text="${brand.name}"></option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label>Model <span class="required-star">*</span></label>
                                    <select id="serviceModelSelect" name="modelId" required disabled style="background: #e2e8f0; color: #1e293b;">
                                        <option value="">Select brand first</option>
                                        <option th:each="model : ${models}" th:value="${model.id}" th:data-brand-id="${model.brandId}" th:text="${model.modelName}"></option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label>Generation</label>
                                    <input type="text" name="generation">
                                </div>
                            </div>

                            <div class="column">
                                <div class="form-group">
                                    <label>Year <span class="required-star">*</span></label>
                                    <input type="number" name="year" min="1970" max="2026" required>
                                </div>

                                <div class="form-group">
                                    <label>Engine capacity <span class="required-star">*</span></label>
                                    <input type="number" step="0.1" min="0.8" max="10.0" name="engineCapacity" required>
                                </div>

                                <div class="form-group">
                                    <label>Type of fuel <span class="required-star">*</span></label>
                                    <select name="fuelTypeId" required>
                                        <option value="">Select type of fuel</option>
                                        <option th:each="fuel : ${fuelTypes}" th:value="${fuel.id}" th:text="${fuel.fuelTypeName}"></option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="form-section-title">Identification</div>

                        <div class="two-columns">
                            <div class="column">
                                <div class="form-group">
                                    <label>
                                        Licence plate <span class="required-star">*</span>
                                    </label>

                                    <input type="text" name="licencePlate">

                                    <p class="car-validation-error"
                                       th:if="${licencePlateError}"
                                       th:text="${licencePlateError}">
                                    </p>
                                </div>
                            </div>

                            <div class="column">
                                <div class="form-group">
                                    <label>
                                        VIN <span class="required-star">*</span>
                                    </label>

                                    <input type="text" name="vin">

                                    <p class="car-validation-error"
                                       th:if="${vinError}"
                                       th:text="${vinError}">
                                    </p>
                                </div>
                            </div>
                        </div>

                        <div class="modal-actions-centered">
                            <button type="button"
                                    class="btn-blue-outline"
                                    onclick="closeAddCarModal()">
                                Cancel
                            </button>
                            <button type="submit" class="btn-blue-solid">Add car</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="service-table-wrapper">

                <table class="service-cars-table">

                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Brand</th>
                        <th>Model</th>
                        <th>Generation</th>
                        <th>Year</th>
                        <th>Engine</th>
                        <th>Fuel</th>
                        <th>Plate</th>
                        <th>VIN</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:if="${#lists.isEmpty(cars)}">
                        <td colspan="9" style="text-align:center;padding:40px;">No cars yet</td>
                    </tr>
                    <tr th:each="car, iterStat : ${cars}"
                        th:attr="data-brand=${car.brandName},
                                 data-plate=${car.licencePlate}">
                        <td th:text="${iterStat.count}">1</td>
                        <td th:text="${car.brandName}">Brand</td>
                        <td th:text="${car.modelName}">Model</td>
                        <td th:text="${car.generation != null ? car.generation : '-'}">Gen</td>
                        <td th:text="${car.year}">Year</td>
                        <td th:text="${car.engineCapacity}">Engine</td>
                        <td>-</td>
                        <td th:text="${car.licencePlate != null ? car.licencePlate : '-'}">Plate</td>
                        <td>-</td>
                        <td>
                            <a th:href="@{/cars/{carId}/repairs(carId=${car.id})}"
                               style="background: #5ab2da; color: black; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: bold;">
                                View repairs
                            </a>
                        </td>
                    </tr>
                    </tbody>

                </table>

            </div>

            <div class="service-total-cars-bar">
                Total cars: <span th:text="${totalCars}">0</span>
            </div>

        </main>

    </div>

</div>

<!-- PROFILE MODAL -->
<div id="modal" class="modal">
    <div class="modal-content dark-modal profile-modal">

        <div class="profile-header">

            <div class="profile-avatar-circle"></div>

            <span class="profile-name-large"
                  th:text="${profileUser.fullName}">
            </span>

            <a th:href="@{/logout}" class="btn-logout-red">
                Log Out
            </a>

        </div>

        <button type="button"
                class="close-btn"
                onclick="closeModal()">
            ×
        </button>

        <h2 class="text-center">Profile</h2>

        <div class="dark-form profile-form">

            <div class="form-group-horizontal">
                <label>Name</label>

                <input type="text"
                       th:value="${profileUser.fullName}"
                       readonly>
            </div>

            <div class="form-group-horizontal">
                <label>Email</label>

                <input type="email"
                       th:value="${profileUser.email}"
                       readonly>
            </div>

            <div class="form-group-horizontal">
                <label>Password</label>

                <input type="password"
                       value="********"
                       readonly>
            </div>

            <div class="form-group-horizontal currency-row">

                <label>Currency</label>

                <form th:action="@{/settings/update-currency}"
                      method="post"
                      class="currency-form">

                    <select name="currencyId"
                            class="currency-select"
                            onchange="this.form.submit()">

                        <option th:each="curr : ${currencies}"
                                th:value="${curr.id}"
                                th:text="${curr.currencySymbol}"
                                th:selected="${profileUser.currency != null && profileUser.currency.id == curr.id}">
                        </option>

                    </select>

                </form>

                <button type="button"
                        class="btn-edit-blue"
                        onclick="openEditProfileModal()">
                    Edit
                </button>

            </div>

            <div class="profile-danger-zone">

                <form th:action="@{/settings/delete-account}"
                      method="post">

                    <button type="submit"
                            class="btn-delete-account">
                        Delete account
                    </button>

                </form>

            </div>

        </div>

    </div>
</div>

<!-- EDIT PROFILE MODAL -->
<div id="editProfileModal" class="modal">

    <div class="edit-profile-modal-content">

        <button type="button"
                class="edit-profile-close-btn"
                onclick="closeEditProfileModal()">
            ×
        </button>

        <h2>Profile</h2>

        <form th:action="@{/settings/update-profile}"
              method="post"
              class="edit-profile-form"
              id="editProfileForm">

            <div class="edit-profile-row">
                <label>Name</label>
                <input type="text"
                       name="fullName"
                       th:value="${profileUser.fullName}">
            </div>

            <div class="edit-profile-row">
                <label>Email</label>
                <input type="email"
                       th:value="${profileUser.email}"
                       readonly>
            </div>

            <div class="edit-profile-row">
                <label>Password</label>
                <input type="password"
                       name="oldPassword"
                       placeholder="Enter old password">
            </div>

            <div class="profile-password-error"
                 th:if="${profileError}"
                 th:text="${profileError}">
            </div>

            <div class="edit-profile-row">
                <label></label>
                <input type="password"
                       name="newPassword"
                       placeholder="Enter new password">
            </div>

            <div class="edit-profile-actions">

                <button type="button"
                        class="edit-profile-cancel-btn"
                        onclick="closeEditProfileModal()">
                    Cancel
                </button>

                <button type="submit"
                        class="edit-profile-save-btn">
                    Save
                </button>

            </div>

        </form>

    </div>

</div>

<script>
    function openModal() {
        document.getElementById("modal").style.display = "flex";
    }

    function closeModal() {
        document.getElementById("modal").style.display = "none";
    }

    function openEditProfileModal() {
        closeModal();
        document.getElementById("editProfileModal").style.display = "flex";
    }

    function closeEditProfileModal() {
        document.getElementById("editProfileModal").style.display = "none";
    }

    function openAddCarModal() {
        document.getElementById("addServiceCarModal").style.display = "flex";
    }

    function closeAddCarModal() {

        document.getElementById("addServiceCarModal").style.display = "none";

        const licenceError = document.querySelector(".licence-error");
        const vinError = document.querySelector(".vin-error");
        const form = document.querySelector("#addServiceCarModal form");

        if (licenceError) {
            licenceError.style.display = "none";
        }

        if (vinError) {
            vinError.style.display = "none";
        }

        if (form) {
            form.reset();
        }

        document.querySelectorAll(".car-validation-error")
            .forEach(error => error.style.display = "none");
    }
</script>

<script th:inline="javascript">
    const shouldOpenEditProfileModal = /*[[${openEditProfileModal}]]*/ false;
    const shouldOpenAddCarModal = /*[[${openAddCarModal}]]*/ false;

    document.addEventListener("DOMContentLoaded", function () {
        if (shouldOpenEditProfileModal === true || shouldOpenEditProfileModal === "true") {
            openEditProfileModal();
        }

        if (shouldOpenAddCarModal === true || shouldOpenAddCarModal === "true") {
            openAddCarModal();
        }
    });
</script>
<script>
    function filterServiceModels() {
        var brandSelect = document.getElementById('serviceBrandSelect');
        var modelSelect = document.getElementById('serviceModelSelect');
        var selectedBrandId = brandSelect.value;
        var options = modelSelect.querySelectorAll('option');

        modelSelect.value = "";
        if (selectedBrandId === "") {
            modelSelect.disabled = true;
            modelSelect.style.background = "#e2e8f0";
            options[0].text = "Select brand first";
        } else {
            modelSelect.disabled = false;
            modelSelect.style.background = "white";
            options[0].text = "Select model";
        }

        options.forEach(function(option) {
            if (option.value === "") return;
            option.style.display = option.getAttribute('data-brand-id') === selectedBrandId ? '' : 'none';
        });
    }
</script>

<script>
    function normalizePlate(value) {
        return (value || "")
            .toString()
            .toLowerCase()
            .replace(/\s+/g, "")
            .replace(/-/g, "")
            .trim();
    }

    function filterServiceCars() {

        const selectedBrand = document
            .getElementById("brandFilter")
            .value
            .toLowerCase()
            .trim();

        const plateSearch = normalizePlate(
            document.getElementById("plateSearch").value
        );

        const rows = document.querySelectorAll(
            ".service-cars-table tbody tr"
        );

        rows.forEach(row => {

            const brand = (row.getAttribute("data-brand") || "")
                .toLowerCase()
                .trim();

            const plate = normalizePlate(
                row.getAttribute("data-plate")
            );

            const brandMatch =
                selectedBrand === "" ||
                brand === selectedBrand;

            const plateMatch =
                plateSearch === "" ||
                plate.includes(plateSearch);

            row.style.display =
                brandMatch && plateMatch ? "" : "none";
        });
    }
</script>
</body>
</html>
