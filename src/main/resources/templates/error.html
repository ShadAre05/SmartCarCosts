<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 - Page Not Found</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #23384f;
            color: white;

            font-family: Arial, sans-serif;
        }

        .error-container {
            display: flex;
            align-items: center;
            gap: 80px;

            max-width: 1200px;
            padding: 40px;
        }

        .error-text h1 {
            font-size: 140px;
            margin: 0;

            color: #5ab2da;
        }

        .error-text h2 {
            font-size: 42px;
            margin: 10px 0 30px;
        }

        .error-text p {
            font-size: 28px;
            line-height: 1.5;

            color: #d0d8e0;
        }

        .home-button {
            margin-top: 40px;

            display: inline-block;

            padding: 16px 36px;

            background: #5ab2da;
            color: black;

            text-decoration: none;
            font-size: 22px;
            font-weight: bold;

            border-radius: 12px;
        }

        .kraken-image {
            max-width: 420px;
        }

        .kraken-image img {
            width: 100%;
        }
    </style>
</head>

<body>

<div class="error-container">

    <div class="error-text">

        <h1>404</h1>

        <h2>Oops! Page not found.</h2>

        <p>
            The page you are looking for seems to have
            disappeared into the depths of the ocean.
        </p>

        <p>
            Our Kraken searched everywhere,
            but couldn't find it.
        </p>

        <a href="/" class="home-button">
            Return to SmartCarCosts
        </a>

    </div>

    <div class="kraken-image">
        <img src="/images/error-kraken.png" alt="Kraken">
    </div>

</div>

</body>
</html>
